---
# Manage swap files. Requires root privileges.
# Adapted from cogni-ai-infra/ansible/ppnt/swapfile.yml.
- name: Manage swap files
  become: "{{ (ansible_facts['user_id'] | default('root') != 'root') or (lookup('env', 'UID') | int != 0) }}"
  block:
    - name: Check if swap files exist
      ansible.builtin.stat:
        path: '{{ item.path }}'
      loop: '{{ linux_extras_swapfile_files }}'
      loop_control:
        label: '{{ item.path }}'
      register: linux_extras_swapfile_stat
    - name: Create swap files
      ansible.builtin.command:
        cmd: fallocate -l {{ item.item.size | quote }} {{ item.item.path | quote }}
      loop: '{{ linux_extras_swapfile_stat.results }}'
      loop_control:
        label: '{{ item.item.path }}'
      when: not item.stat.exists
      changed_when: true
    - name: Set swap file permissions
      ansible.builtin.file:
        path: '{{ item.path }}'
        owner: root
        group: root
        mode: '0600'
      loop: '{{ linux_extras_swapfile_files }}'
      loop_control:
        label: '{{ item.path }}'
    - name: Format swap files
      ansible.builtin.command:
        cmd: mkswap {{ item.item.path | quote }}
      loop: '{{ linux_extras_swapfile_stat.results }}'
      loop_control:
        label: '{{ item.item.path }}'
      when: not item.stat.exists
      changed_when: true
    - name: Activate swap files
      ansible.builtin.command:
        cmd: swapon {{ item.path | quote }}
      loop: '{{ linux_extras_swapfile_files }}'
      loop_control:
        label: '{{ item.path }}'
      register: linux_extras_swapfile_swapon
      when: linux_extras_swapfile_activate | bool
      changed_when: linux_extras_swapfile_swapon.rc == 0
      failed_when:
        - linux_extras_swapfile_swapon.rc != 0
        - "'resource busy' not in linux_extras_swapfile_swapon.stderr"
    - name: Add swap entries to /etc/fstab
      ansible.builtin.lineinfile:
        path: /etc/fstab
        line: '{{ item.path }} none swap sw 0 0'
        state: present
        create: true
        mode: '0644'
      loop: '{{ linux_extras_swapfile_files }}'
      loop_control:
        label: '{{ item.path }}'
      when: linux_extras_swapfile_fstab | bool
