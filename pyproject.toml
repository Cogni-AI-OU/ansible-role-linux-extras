# Project metadata for the ansible-role-linux-extras role.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ansible-role-linux-extras"
version = "0.1.0"
description = "Ansible role for provisioning Linux extras (e.g. swapfile)."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
  "requests>=2.32.0",
  "tabulate>=0.9.0",
  "PyYAML>=6.0.1",
]

authors = [
  { name = "Cogni AI" },
]

[project.urls]
Homepage = "https://github.com/Cogni-AI-OU/ansible-role-linux-extras"
Repository = "https://github.com/Cogni-AI-OU/ansible-role-linux-extras"
